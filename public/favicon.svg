<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The screen: Inkbridge's plum paper with its dot grid. -->
  <rect x="5" y="9" width="45" height="35" rx="6" fill="#231f29" stroke="#a9a6b0" stroke-width="2.5" />
  <g fill="#9b99a1">
    <circle cx="13" cy="17" r="1.1" /><circle cx="21" cy="17" r="1.1" /><circle cx="29" cy="17" r="1.1" /><circle cx="37" cy="17" r="1.1" /><circle cx="45" cy="17" r="1.1" />
    <circle cx="13" cy="25" r="1.1" /><circle cx="21" cy="25" r="1.1" /><circle cx="29" cy="25" r="1.1" /><circle cx="45" cy="25" r="1.1" />
    <circle cx="13" cy="33" r="1.1" /><circle cx="37" cy="33" r="1.1" /><circle cx="45" cy="33" r="1.1" />
  </g>
  <!-- The line the pencil is drawing. -->
  <path d="M11 36c5-1 7-9 12-9s5 5 9 2 3-4 3-4" fill="none" stroke="#ffd166" stroke-width="3" stroke-linecap="round" />
  <!-- The pencil, tip on the screen, body crossing its corner. -->
  <g transform="translate(35 25) rotate(45)" stroke="#16131b" stroke-width="2" stroke-linejoin="round" paint-order="stroke">
    <path d="M0 0 L8 -4.5 L8 4.5 Z" fill="#f4e3c3" />
    <path d="M0 0 L3 -1.7 L3 1.7 Z" fill="#1b1622" />
    <rect x="8" y="-4.5" width="22" height="9" fill="#c4a7ff" />
    <rect x="30" y="-4.5" width="4" height="9" fill="#d9d6de" />
    <rect x="34" y="-4.5" width="5" height="9" rx="2" fill="#ff8a9c" />
  </g>
</svg>
