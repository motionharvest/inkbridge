<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#16131b" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Inkbridge</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <section id="pair" class="view" hidden>
      <div class="pair-panel">
        <h1>Inkbridge</h1>
        <p>Draw on one device. See it and copy it on the other.</p>
        <button id="create-space" class="primary">Start a new space</button>
        <div class="divider"><span>or join one</span></div>
        <form id="join-form">
          <input id="join-code" inputmode="numeric" autocomplete="off" maxlength="7" placeholder="6-digit code" aria-label="Space code" />
          <button type="submit">Join</button>
        </form>
        <p id="pair-error" class="error" role="alert"></p>
      </div>
    </section>

    <section id="library" class="view" hidden>
      <header class="library-bar">
        <h1>Notebooks</h1>
        <div class="space-info">
          <span class="label">Space code</span>
          <span id="space-code" class="code"></span>
          <span id="peers" class="peers"></span>
          <button id="leave" class="quiet">Leave</button>
          <button id="library-done" class="primary" hidden>Done</button>
        </div>
      </header>
      <div id="notebooks" class="grid"></div>
    </section>

    <section id="notebook" class="view" hidden>
      <header class="toolbar">
        <button id="back" class="tool" title="Notebooks" aria-label="Notebooks">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <button id="title" class="title" title="Rename notebook"></button>
        <div class="group">
          <button id="undo" class="tool" title="Undo (Ctrl+Z)" aria-label="Undo">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5" /><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></svg>
          </button>
          <button id="copy" class="tool" title="Copy the page, or the lasso selection, to the computer (Ctrl+C)" aria-label="Copy">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="2" /><path d="M15.5 8.5V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v7.5a2 2 0 0 0 2 2h2.5" /></svg>
          </button>
          <button id="paste" class="tool" title="Paste the computer's clipboard onto the page (Ctrl+V pastes this device's clipboard)" aria-label="Paste">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4.5H7a2 2 0 0 0-2 2V19a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6.5a2 2 0 0 0-2-2h-2" /><rect x="9" y="3" width="6" height="3.5" rx="1" /><path d="M9 12h6M9 16h4" /></svg>
          </button>
        </div>
        <span id="status" class="status"></span>
        <div class="spacer"></div>
        <div class="group" id="color-slots"></div>
        <button id="add-color" class="add-color" title="Add a color" aria-label="Add a color">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
        </button>
        <div class="group" id="size-slots"></div>
        <div class="group">
          <button id="pen-tool" class="tool" title="Pen" aria-label="Pen" aria-pressed="true">
            <svg class="filled" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.6 3.4a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L9.2 19.8 3 21l1.2-6.2z" /><path class="cut" d="M13.5 5.5l5 5" /></svg>
          </button>
          <button id="eraser-tool" class="tool" title="Eraser (E)" aria-label="Eraser" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 20l-4.5-4.5a1.5 1.5 0 0 1 0-2.1L13.4 3.5a1.5 1.5 0 0 1 2.1 0l5 5a1.5 1.5 0 0 1 0 2.1L11 20z" /><path d="M8.5 9l7 7" /><path d="M8 20h12" /></svg>
          </button>
          <button id="select-tool" class="tool" title="Lasso: circle ink or images to move or copy them (S)" aria-label="Lasso" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 16.5C4.4 15.3 3 13.2 3 11c0-4 4-7 9-7s9 3 9 7-4 7-9 7c-1.2 0-2.3-.2-3.3-.5" stroke-dasharray="3 2.6" /><path d="M8.7 17.5c-.4 1.6-1.6 2.5-3.2 2.5" /><circle cx="8.2" cy="16.6" r="1.4" /></svg>
          </button>
        </div>
      </header>
      <div id="selection-menu" class="selection-menu" role="menu" hidden>
        <button id="copy-selection" role="menuitem">Copy</button>
        <button id="remove-selection" class="danger" role="menuitem">Remove selection</button>
      </div>
      <div id="size-menu" class="size-menu" hidden>
        <input id="size-slider" type="range" aria-label="Size of the selected slot" />
        <div class="ticks" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
      </div>
      <div class="workspace">
        <main id="stage">
          <div class="sheet">
            <canvas class="paper"></canvas>
            <canvas class="ink"></canvas>
          </div>
        </main>
        <div id="page-grid" class="page-grid" hidden>
          <header class="page-grid-bar">
            <span class="page-grid-title">Pages</span>
            <span class="page-grid-hint">Press and hold a page to remove pages</span>
            <button id="grid-done" class="primary" hidden>Done</button>
          </header>
          <div id="grid-pages" class="grid-pages"></div>
        </div>
        <div class="page-nav">
          <button id="prev" class="quiet" title="Previous page (←)" aria-label="Previous page">‹</button>
          <button id="page-number" class="quiet page-number" title="Show all pages"></button>
          <button id="next" class="quiet" title="Next page, or a new page at the end (→)" aria-label="Next page">›</button>
        </div>
      </div>
    </section>

    <div id="toast" role="status" hidden></div>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
